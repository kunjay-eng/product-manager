<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สแกน QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#111; font-family: -apple-system, sans-serif; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
  #status { font-size:14px; margin-bottom:14px; text-align:center; padding:0 24px; }
  video { width:min(90vw,360px); height:min(90vw,360px); object-fit:cover; border-radius:20px; background:#000; display:none; }
  #frame { position:absolute; width:min(90vw,360px); height:min(90vw,360px); border:3px solid #ff7a30; border-radius:20px; box-shadow:0 0 0 9999px rgba(0,0,0,0.5); display:none; }
  button { margin-top:20px; padding:12px 28px; border-radius:999px; border:none; background:#fff; color:#111; font-weight:600; font-size:15px; }
  #resultBox { display:none; margin-top:16px; padding:14px; background:#222; border-radius:12px; max-width:90vw; word-break:break-all; text-align:center; }
</style>
</head>
<body>
  <div id="status">กำลังขอสิทธิ์ใช้กล้อง...</div>
  <video id="video" playsinline autoplay muted></video>
  <div id="frame"></div>
  <div id="resultBox"></div>
  <button id="retryBtn" style="display:none;">ลองใหม่</button>

  <script>
    const statusEl = document.getElementById('status');
    const video = document.getElementById('video');
    const frame = document.getElementById('frame');
    const resultBox = document.getElementById('resultBox');
    const retryBtn = document.getElementById('retryBtn');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let stream = null, rafId = null, stopped = false, detector = null, mode = null;

    function sendResult(text){
      resultBox.textContent = '✓ อ่านได้: ' + text;
      resultBox.style.display = 'block';
      if (window.opener){
        window.opener.postMessage({ type: 'qr-scanned', data: text }, '*');
        setTimeout(() => window.close(), 600);
      }
    }
    function showError(msg){
      statusEl.textContent = msg;
      video.style.display = 'none'; frame.style.display = 'none';
      retryBtn.style.display = 'inline-block';
    }
    retryBtn.onclick = () => { stopped = false; retryBtn.style.display = 'none'; start(); };

    async function start(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        showError('⚠️ เบราว์เซอร์นี้ไม่รองรับกล้องจากหน้าเว็บ'); return;
      }
      if ('BarcodeDetector' in window){
        try{
          const supported = await BarcodeDetector.getSupportedFormats();
          if (supported.includes('qr_code')){ detector = new BarcodeDetector({ formats: ['qr_code'] }); mode = 'native'; }
        } catch(e){}
      }
      if (!mode){
        if (typeof jsQR !== 'function'){ showError('⚠️ โหลดตัวอ่าน QR ไม่สำเร็จ'); return; }
        mode = 'jsqr';
      }
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      } catch(err){
        showError('⚠️ เปิดกล้องไม่สำเร็จ: ' + (err.name === 'NotAllowedError' ? 'ยังไม่ได้อนุญาตสิทธิ์กล้อง' : err.message));
        return;
      }
      video.srcObject = stream;
      statusEl.textContent = 'เล็งกล้องไปที่ QR Code';
      video.style.display = 'block'; frame.style.display = 'block';
      rafId = requestAnimationFrame(mode === 'native' ? tickNative : tickJsQR);
    }

    async function tickNative(){
      if (stopped) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA){
        try{
          const codes = await detector.detect(video);
          if (codes.length > 0 && codes[0].rawValue){ stopped = true; cleanup(); sendResult(codes[0].rawValue); return; }
        } catch(e){}
      }
      rafId = requestAnimationFrame(tickNative);
    }
    function tickJsQR(){
      if (stopped) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data){ stopped = true; cleanup(); sendResult(code.data); return; }
      }
      rafId = requestAnimationFrame(tickJsQR);
    }
    function cleanup(){
      if (rafId) cancelAnimationFrame(rafId);
      if (stream) stream.getTracks().forEach(t => t.stop());
    }
    start();
  </script>
</body>
</html>
